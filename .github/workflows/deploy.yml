name: Deploy Backend (Spring Boot) to AWS ECS

on:
  push:
    branches:
      - develop
    paths:
      - 'back-Despachos_SpringBoot/**'
      - 'back-Ventas_SpringBoot/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: innovatech-cluster
  SVC_DESPACHOS: svc-despachos
  SVC_VENTAS: svc-ventas
  ECR_DESPACHOS_REPO: innovatech-despachos
  ECR_VENTAS_REPO: innovatech-ventas

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # === MICROSERVICIO: DESPACHOS ===
      - name: Build & Push Despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_DESPACHOS_REPO }}:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/${{ env.ECR_DESPACHOS_REPO }}:latest

      - name: Deploy Despachos to Amazon ECS
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.SVC_DESPACHOS }} --force-new-deployment

      # === MICROSERVICIO: VENTAS ===
      - name: Build & Push Ventas
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_VENTAS_REPO }}:latest ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push $ECR_REGISTRY/${{ env.ECR_VENTAS_REPO }}:latest

      - name: Deploy Ventas to Amazon ECS
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.SVC_VENTAS }} --force-new-deployment